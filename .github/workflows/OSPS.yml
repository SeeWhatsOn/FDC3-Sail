name: OSPS Security Assessment

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Mondays at 9 AM UTC
  workflow_dispatch: # Allow manual triggering

# Default: least privilege. This job adds only the write scopes its steps need.
permissions:
  contents: read

jobs:
  osps-assessment:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # code-scanning / Advanced Security SARIF upload (osps-baseline-action upload-sarif)
      security-events: write
      # actions/upload-artifact
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Open Source Project Security Baseline Scanner
        uses: revanite-io/osps-baseline-action@6ba0e05ce6566af82fd77bb9356ae8387027f32e # v1.5.0
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          # The built-in token is what the OSSF reference workflow uses. It cannot
          # read the admin-gated GraphQL fields (branch protection, org MFA), so
          # OSPS-AC-03 stays unresolved without a PAT carrying admin:org. Scanner
          # v0.28.0+ treats that denial as partial data and scans on; v0.22.0,
          # pinned by action v1.3.3, aborted the whole scan on it.
          token: ${{ github.token }}
          catalog: "osps-baseline-2026-02"
          upload-sarif: "true"

      - name: Upload Assessment Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: osps-assessment-results-${{ github.run_number }}
          path: evaluation_results/
          retention-days: 30
